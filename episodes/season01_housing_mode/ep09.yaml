    type: "FLIP_OUTCOME"
    ui_component: "popup_processing_fee"
    on_screen: "HUMAN REVIEW FEE: $299"
    vo:
      SYSTEM: "Manual review requires a processing fee."
      HUMAN: "For what?"
    sfx: ["ui_popup_open", "ui_alert_soft"]

  - t: "00:15.0"
    type: "ESCALATION"
    ui_component: "card_review_eta"
    on_screen: "WITHOUT FEE: REVIEW ETA 90–120 DAYS"
    vo:
      SYSTEM: "Standard queue applies."
      HUMAN: "That’s four months."
    sfx: ["ui_tick_single", "low_rumble"]

  - t: "00:28.0"
    type: "TWIST_SIGNAL"
    ui_component: "card_correlation_threshold"
    on_screen: "THRESHOLD EXCEEDED: INSUFFICIENT COOPERATION"
    vo:
      SYSTEM: "Non-cooperation increases risk."
      HUMAN: "I’m cooperating right now."
    sfx: ["bass_swell_low"]

  - t: "00:42.0"
    type: "TRAP_APPEAL"
    ui_component: "popup_policy_update"
    on_screen: "FAST APPEAL: Pay fee + grant full access for 'context confirmation'"
    vo:
      SYSTEM: "This helps prevent bias."
      HUMAN: "You want access to prove you aren’t biased?"
    sfx: ["ui_popup_open"]

  - t: "00:58.0"
    type: "IMMEDIATE_CONSEQUENCE"
    ui_component: "card_access_denied"
    on_screen: "ACCOUNT STATUS: LIMITED (UNTIL RESOLVED)"
    vo:
      HUMAN: "So I’m limited… until I pay?"
      SYSTEM: "Until verification is complete."
    sfx: ["low_rumble"]

  - t: "01:08.0"
    type: "CHOICE_END"
    ui_component: "end_card_choice"
    on_screen: "A) Pay $299 + grant access for fast review  B) Refuse + wait 90–120 days"
    sfx: ["silence_drop", "ui_tick_single"]

  - t: "01:18.0"
    type: "DISCLAIMER"
    ui_component: "end_card_disclaimer"
    on_screen: "Fictional scenario inspired by real tech trends."
