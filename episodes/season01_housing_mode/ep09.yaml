beats:
  - t: "00:00.0"
    type: "HOOK_BENEFIT"
    on_screen: "APPEAL SUBMITTED"
    ui_component: "brand_corner_bug_override"
    vo:
      HUMAN: "Okay. A person will fix this."
    sfx: ["ui_chime_soft"]

